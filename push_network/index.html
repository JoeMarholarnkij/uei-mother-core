<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The reduce 4.0°C - Sovereign Dashboard</title>
    <!-- Include Marked.js for real-time Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #050505;
            --primary-blue: #0ea5e9;
            --text-color: #e2e8f0;
            --log-bg: #111111;
            --border-color: #334155;
            --success-green: #10b981;
        }
        body { 
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        header {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(15px);
            z-index: 100;
        }
        h1 { margin: 0; font-size: 1.4rem; letter-spacing: 2px; color: var(--primary-blue); font-weight: 800; }
        
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
            box-sizing: border-box;
        }

        #log { 
            flex: 1;
            background: var(--log-bg); 
            padding: 1.5rem; 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 1.5rem;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
        }

        /* Markdown Styling */
        .markdown-body { line-height: 1.6; font-size: 0.95rem; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: var(--primary-blue); margin-top: 1.5rem; border-bottom: 1px solid #222; padding-bottom: 0.3rem; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin: 1rem 0; background: #0a0a0a; border-radius: 8px; overflow: hidden; }
        .markdown-body th, .markdown-body td { border: 1px solid var(--border-color); padding: 12px; text-align: left; }
        .markdown-body th { background: rgba(14, 165, 233, 0.15); color: var(--primary-blue); font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
        .markdown-body tr:hover { background: rgba(255,255,255,0.02); }
        .markdown-body blockquote { border-left: 4px solid var(--primary-blue); padding-left: 1rem; margin: 1rem 0; color: #94a3b8; font-style: italic; }
        .markdown-body code { background: #222; padding: 2px 5px; border-radius: 4px; font-family: monospace; color: #f472b6; }

        .log-entry {
            padding: 1.2rem;
            border-radius: 8px;
            background: rgba(255,255,255,0.01);
            border: 1px solid rgba(255,255,255,0.03);
            animation: slideIn 0.3s ease-out;
        }
        .log-entry.uplink { background: rgba(14, 165, 233, 0.03); border-left: 4px solid var(--primary-blue); }
        .log-entry.reply { background: rgba(16, 185, 129, 0.03); border-left: 4px solid var(--success-green); }
        .log-entry.alert { border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.05); }

        .timestamp { color: #475569; font-size: 0.75rem; margin-bottom: 0.5rem; display: block; font-family: monospace; }

        .input-area {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
            padding: 0.8rem;
            background: #0a0a0a;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        #cmd-input { 
            flex: 1;
            background: transparent; 
            color: var(--text-color); 
            border: none;
            outline: none;
            font-size: 1.05rem;
            padding: 0.5rem;
        }

        button { 
            background-color: var(--primary-blue); 
            color: white; 
            border: none; 
            padding: 10px 24px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 700;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover { background-color: #0284c7; filter: brightness(1.1); transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        .status-pill {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>Mission: The Reduce 4.0°C | ลดอุณหภูมิลง 4.0 องศาเซลเซียส</h1>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <span id="user-info" style="font-size: 0.8rem; color: var(--primary-blue); font-weight: bold;"></span>
            <div id="g_id_signin"></div>
            <button id="btn-logout" style="display: none; padding: 6px 15px; font-size: 0.75rem; background: transparent; border: 1px solid #ef4444; color: #ef4444;">LOGOUT</button>
            <span class="status-pill">SOCIALLY RESONANT</span>
            <button id="btn-permission" style="padding: 6px 15px; font-size: 0.75rem; background: transparent; border: 1px solid var(--primary-blue); color: var(--primary-blue);">SECURE COMMS</button>
        </div>
    </header>

    <main>
        <div id="log">
            <div class="log-entry">System ready. Awaiting Lead Architect SSO Authentication...</div>
        </div>

        <div class="input-area" id="chat-input-area" style="display: none;">
            <input type="text" id="cmd-input" placeholder="Enter Command for Mother Core..." autocomplete="off" autofocus>
            <button id="btn-send-cmd">SEND</button>
        </div>
        <div id="auth-warning" style="margin-top: 1rem; text-align: center; color: #ef4444; font-weight: bold;">
            Google SSO required to access Mother Core.
        </div>
    </main>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>

    <script>
        // --- SOVEREIGN SSO CONFIGURATION ---
        const CLIENT_ID = "369945105284-u1vbniav0ca5qcvrltdel037556kmlck.apps.googleusercontent.com"; 
        const AUTHORIZED_EMAILS = ["marholarnkij@hotmail.com", "marholarnkij@gmail.com"];

        const logDiv = document.getElementById('log');
        const cmdInput = document.getElementById('cmd-input');
        const btnSendCmd = document.getElementById('btn-send-cmd');
        const btnLogout = document.getElementById('btn-logout');
        const userInfo = document.getElementById('user-info');
        const chatInputArea = document.getElementById('chat-input-area');
        const authWarning = document.getElementById('auth-warning');
        const signInButton = document.getElementById('g_id_signin');

        let idToken = localStorage.getItem('sovereign_token');

        function handleCredentialResponse(response) {
            idToken = response.credential;
            localStorage.setItem('sovereign_token', idToken);
            verifyAndActivate();
        }

        function verifyAndActivate() {
            if (!idToken) return;

            try {
                const payload = JSON.parse(atob(idToken.split('.')[1]));
                const email = payload.email;
                const exp = payload.exp * 1000;

                // Check token expiry
                if (Date.now() > exp) {
                    logout();
                    return;
                }

                userInfo.textContent = email;
                signInButton.style.display = 'none';
                btnLogout.style.display = 'block';

                if (AUTHORIZED_EMAILS.includes(email)) {
                    chatInputArea.style.display = 'flex';
                    authWarning.style.display = 'none';
                    if (!window.activated_msg) {
                        addLog(`### 🔐 ARCHITECT VERIFIED\nWelcome back, P'Joe. Session restored via Sovereign Vault.`);
                        window.activated_msg = true;
                    }
                } else {
                    chatInputArea.style.display = 'none';
                    authWarning.textContent = `ACCESS DENIED: Identity ${email} is not authorized for Mother Core.`;
                    authWarning.style.display = 'block';
                }
            } catch (e) {
                logout();
            }
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: CLIENT_ID,
                callback: handleCredentialResponse,
                auto_select: true
            });
            google.accounts.id.renderButton(
                signInButton,
                { theme: "outline", size: "medium", text: "signin_with" }
            );
            
            if (idToken) {
                verifyAndActivate();
            } else {
                google.accounts.id.prompt(); 
            }
        };

        function logout() {
            idToken = null;
            localStorage.removeItem('sovereign_token');
            google.accounts.id.disableAutoSelect();
            location.reload();
        }

        btnLogout.onclick = logout;

        function addLog(content, type = '') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const time = new Date().toLocaleTimeString();
            const renderedContent = marked.parse(content);
            
            entry.innerHTML = `
                <span class="timestamp">[${time}]</span>
                <div class="markdown-body">${renderedContent}</div>
            `;
            logDiv.prepend(entry);
        }

        btnSendCmd.onclick = () => {
            const cmd = cmdInput.value.trim();
            if (!cmd || !idToken) return;
            addLog(`**COMMAND:** ${cmd}`, 'uplink');
            
            fetch('/uplink', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${idToken}`
                },
                body: JSON.stringify({ command: cmd })
            })
            .then(response => {
                if (response.status === 401 || response.status === 403) throw new Error("Unauthorized");
                return response.json();
            })
            .then(data => {
                addLog(data.reply, 'reply');
            })
            .catch(err => {
                addLog(`**ERROR:** ${err.message}`, 'alert');
            });
            
            cmdInput.value = '';
        };

        cmdInput.addEventListener("keypress", (e) => { if (e.key === "Enter") btnSendCmd.click(); });

        messaging.onMessage((payload) => {
            addLog(`### 🔥 EMERGENCY ALERT\n${payload.notification.body}`, 'alert');
        });

        document.getElementById('btn-permission').onclick = () => {
            Notification.requestPermission().then((p) => {
                if (p === 'granted') {
                    addLog("### 🛡️ COMM-LINK ESTABLISHED\nPush notifications authorized by Architect.");
                    messaging.getToken({ vapidKey: 'BA9rc0jur0AoqC1qnRZrPQiEFQSzEXE2PJszlAXT2iLUb3Q7WviCqQqIHOjxBWHYYG23TfsvmKDcJobtsi-sDQM' })
                             .then(t => console.log("FCM Token:", t));
                }
            });
        };
    </script>
</body>
</html>
