<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
    <!-- Dark Tech Background -->
    <rect width="1200" height="900" fill="#020617" />
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0e7490" stroke-width="0.5" stroke-opacity="0.1"/>
        </pattern>
        <linearGradient id="housingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1e293b" />
            <stop offset="100%" style="stop-color:#0f172a" />
        </linearGradient>
        <linearGradient id="metalReflect" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#0891b2;stop-opacity:0.2" />
            <stop offset="50%" style="stop-color:#22d3ee;stop-opacity:0.5" />
            <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.2" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <rect width="1200" height="900" fill="url(#grid)" />

    <!-- 1. MAIN HOUSING (50) - Isometric Cylinder Cutaway -->
    <g id="housing_main">
        <!-- Back shell -->
        <path d="M 300 250 L 900 250 Q 950 250 950 300 L 950 600 Q 950 650 900 650 L 300 650 Q 250 650 250 600 L 250 300 Q 250 250 300 250" fill="url(#housingGrad)" stroke="#1e293b" stroke-width="2" />
        <!-- Cutaway area -->
        <path d="M 350 280 L 850 280 L 850 620 L 350 620 Z" fill="#020617" stroke="#334155" stroke-width="1" />
        <text x="960" y="270" fill="#475569" font-family="Arial" font-weight="bold" font-size="24">50</text>
    </g>

    <!-- 2. ROTOR SHAFT (110) - Detailed Isometric -->
    <g id="shaft">
        <rect x="200" y="435" width="800" height="30" rx="5" fill="#94a3b8" />
        <rect x="200" y="445" width="800" height="10" fill="white" fill-opacity="0.1" />
        <text x="210" y="430" fill="#22d3ee" font-family="Arial" font-weight="bold" font-size="12">110 : ROTOR SHAFT [NiFe Quantum Alloy]</text>
    </g>

    <!-- 3. BIONIC IMPELLER (100) - Detailed 3D-ish -->
    <g transform="translate(550, 450)">
        <animateTransform attributeName="transform" type="rotate" from="0 550 450" to="360 550 450" dur="10s" repeatCount="indefinite" />
        
        <!-- Impeller Disk -->
        <ellipse cx="0" cy="0" rx="20" ry="160" fill="#334155" stroke="#22d3ee" stroke-width="2" />
        
        <!-- 3D Lattice Blades (Multi-layered for clarity) -->
        <g stroke="#22d3ee" fill="none">
            <!-- Curved Blade 1 -->
            <path d="M 0 -20 Q 100 -100 120 0" stroke-width="8" opacity="0.9" />
            <path d="M 0 -20 Q 100 -100 120 0" stroke="white" stroke-width="1" opacity="0.3" transform="translate(2,2)" />
            
            <!-- Curved Blade 2 -->
            <path d="M 0 20 Q -100 100 -120 0" stroke-width="8" opacity="0.9" />
            
            <!-- Lattice detail inside blades -->
            <path d="M 40 -40 L 80 -60 M 60 -30 L 100 -50" stroke-width="0.5" opacity="0.6" stroke-dasharray="2,1" />
        </g>
        
        <circle r="40" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
        <text x="50" y="-120" fill="white" font-family="Arial" font-weight="bold" font-size="18">100</text>
    </g>

    <!-- 4. ACTIVE MAGNETIC BEARINGS (200A/B) - With Coil Details -->
    <!-- Front AMB -->
    <g id="amb_front" transform="translate(320, 450)">
        <circle r="70" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.4" />
        <!-- Magnetic Coils -->
        <rect x="-10" y="-85" width="20" height="30" rx="3" fill="#1e293b" stroke="#22d3ee" />
        <rect x="-10" y="55" width="20" height="30" rx="3" fill="#1e293b" stroke="#22d3ee" />
        <rect x="55" y="-10" width="30" height="20" rx="3" fill="#1e293b" stroke="#22d3ee" />
        <rect x="-85" y="-10" width="30" height="20" rx="3" fill="#1e293b" stroke="#22d3ee" />
        <text x="-50" y="-95" fill="#22d3ee" font-family="Arial" font-weight="bold" font-size="10">200A (AMB)</text>
    </g>

    <!-- Rear AMB -->
    <g id="amb_rear" transform="translate(850, 450)">
        <circle r="70" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.4" />
        <rect x="-10" y="-85" width="20" height="30" rx="3" fill="#1e293b" stroke="#22d3ee" />
        <rect x="-10" y="55" width="20" height="30" rx="3" fill="#1e293b" stroke="#22d3ee" />
        <text x="20" y="-95" fill="#22d3ee" font-family="Arial" font-weight="bold" font-size="10">200B (AMB)</text>
    </g>

    <!-- 5. CERAMIC TOUCHDOWN BEARINGS (300/400) -->
    <g id="safety_bearings">
        <circle cx="420" cy="450" r="22" fill="#0f172a" stroke="#94a3b8" stroke-width="3" />
        <circle cx="420" cy="450" r="18" fill="none" stroke="white" stroke-width="0.5" opacity="0.2" />
        <text x="400" y="495" fill="#94a3b8" font-family="Arial" font-weight="bold" font-size="11">300 (CERAMIC)</text>

        <circle cx="750" cy="450" r="22" fill="#0f172a" stroke="#94a3b8" stroke-width="3" />
        <text x="730" y="495" fill="#94a3b8" font-family="Arial" font-weight="bold" font-size="11">400 (CERAMIC)</text>
    </g>

    <!-- 6. FLUID PATHS & DATA (7.38 MPa sCO2) -->
    <g id="flow_labels">
        <!-- Inlet -->
        <path d="M 50 450 L 250 450" stroke="#10b981" stroke-width="6" marker-end="url(#arrowhead)" />
        <text x="50" y="430" fill="#10b981" font-family="Arial" font-weight="black" font-size="16">sCO2 INLET (7.38 MPa)</text>
        
        <!-- Outlet -->
        <path d="M 950 500 L 1150 500" stroke="#ef4444" stroke-width="6" />
        <text x="1000" y="530" fill="#ef4444" font-family="Arial" font-weight="black" font-size="16">sCO2 OUTLET</text>
    </g>

    <!-- 7. REAL-TIME TELEMETRY HUD -->
    <rect x="800" y="650" width="350" height="200" rx="20" fill="#0f172a" fill-opacity="0.95" stroke="#22d3ee" stroke-width="2" />
    <text x="825" y="690" fill="#22d3ee" font-family="Arial" font-weight="black" font-size="20">TELEMETRY PANEL</text>
    <line x1="825" y1="700" x2="1125" y2="700" stroke="#22d3ee" stroke-width="1" opacity="0.3" />
    <g font-family="Monospace" font-size="14" fill="white">
        <text x="825" y="735">STABILITY: [99.999%]</text>
        <text x="825" y="760">GAP (μm): [100.012]</text>
        <text x="825" y="785">ROTATION: [45,000 RPM]</text>
        <text x="825" y="810">TEMP (K): [304.25]</text>
        <text x="825" y="835">PHASE: [SUPERCRITICAL]</text>
    </g>

    <!-- 8. LATTICE CALLOUT (Visual Fidelity) -->
    <circle cx="100" cy="150" r="80" fill="#020617" stroke="#22d3ee" stroke-width="2" />
    <!-- Mini lattice pattern -->
    <path d="M 60 120 L 140 120 M 60 150 L 140 150 M 60 180 L 140 180 M 80 110 L 80 190 M 110 110 L 110 190" stroke="#22d3ee" stroke-width="1" opacity="0.4" />
    <text x="100" y="250" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold" font-size="12">VOXEL LATTICE (100)</text>
    <text x="100" y="265" text-anchor="middle" fill="#22d3ee" font-family="Arial" font-size="10">High-Fidelity Internal Core</text>

    <!-- Branding & Title -->
    <text x="600" y="70" text-anchor="middle" fill="white" font-family="Arial" font-weight="black" font-size="32" letter-spacing="10">sCO2 BIONIC TURBINE : NV1 ALPHA</text>
    <text x="600" y="100" text-anchor="middle" fill="#22d3ee" font-family="Arial" font-weight="bold" font-size="14">ENGINEERING MASTERPIECE | JOE'S BROTHER CO., LTD.</text>

    <text x="1170" y="880" text-anchor="end" fill="#1e293b" font-family="Arial" font-style="italic" font-size="10">UEI VISUAL LOBE V12.6 | REAL-TIME ENFORCEMENT</text>
    
    <!-- Arrowhead Def -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#10b981" />
        </marker>
    </defs>
</svg>