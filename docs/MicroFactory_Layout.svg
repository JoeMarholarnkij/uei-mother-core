<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Layout Background -->
  <rect width="800" height="600" fill="#0a0f1d" />
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2533" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- HQ Room Walls -->
  <rect x="50" y="50" width="700" height="500" fill="none" stroke="#334455" stroke-width="3" />
  
  <!-- Title -->
  <text x="60" y="40" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#00ffff" letter-spacing="1">JOE'S BROTHER: MICRO-FACTORY LAYOUT (V1.0)</text>
  
  <!-- Zone A: Electronics Assembly (SMT) -->
  <g transform="translate(100, 100)">
    <rect width="250" height="350" fill="#162035" rx="10" stroke="#00ffff" stroke-width="1" stroke-opacity="0.5" />
    <text x="10" y="25" font-family="Arial" font-size="12" font-weight="bold" fill="#00ffff">ZONE A: PRECISION SMT</text>
    
    <!-- Pick & Place Machine -->
    <rect x="25" y="50" width="200" height="80" fill="#2a3a5a" rx="5" />
    <text x="45" y="95" font-family="Arial" font-size="10" fill="#ffffff">PICK & PLACE (BGA/SiC)</text>
    
    <!-- Vapor Phase Reflow -->
    <rect x="25" y="150" width="200" height="80" fill="#2a3a5a" rx="5" />
    <text x="55" y="195" font-family="Arial" font-size="10" fill="#ffffff">VAPOR PHASE REFLOW</text>
    
    <!-- Desktop X-Ray -->
    <rect x="25" y="250" width="200" height="80" fill="#2a3a5a" rx="5" />
    <text x="65" y="295" font-family="Arial" font-size="10" fill="#ffffff">X-RAY INSPECTION</text>
  </g>

  <!-- Zone B: Mechanical Assembly (NV2) -->
  <g transform="translate(450, 100)">
    <rect width="250" height="350" fill="#162035" rx="10" stroke="#ff00ff" stroke-width="1" stroke-opacity="0.5" />
    <text x="10" y="25" font-family="Arial" font-size="12" font-weight="bold" fill="#ff00ff">ZONE B: NV2 ASSEMBLY</text>
    
    <!-- 3D Printer (Metal) -->
    <rect x="25" y="50" width="200" height="120" fill="#3a2a4a" rx="5" />
    <text x="50" y="115" font-family="Arial" font-size="10" fill="#ffffff">SLM METAL 3D PRINTER</text>
    
    <!-- Clean Bench -->
    <rect x="25" y="190" width="200" height="140" fill="#3a2a4a" rx="5" />
    <text x="55" y="265" font-family="Arial" font-size="10" fill="#ffffff">ISO-7 CLEAN BENCH</text>
  </g>

  <!-- Infrastructure -->
  <rect x="100" y="470" width="600" height="60" fill="#1a2533" rx="10" />
  <text x="320" y="505" font-family="Arial" font-size="12" fill="#8899aa">CENTRAL CONTROL & TELEMETRY HUB (EDEN OS)</text>

  <!-- Status -->
  <circle cx="700" y="35" r="8" fill="#00ff88" />
  <text x="715" y="40" font-family="Arial" font-size="10" fill="#00ff88">READY FOR SETUP</text>
</svg>