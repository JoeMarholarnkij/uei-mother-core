<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="600" fill="#050b15" />
    
    <!-- Grid Pattern -->
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0e7490" stroke-width="0.5" stroke-opacity="0.2"/>
        </pattern>
        <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0e7490;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="800" height="600" fill="url(#grid)" />

    <!-- Central Core: Architect -->
    <circle cx="400" cy="300" r="80" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="10,5">
        <animateTransform attributeName="transform" type="rotate" from="0 400 300" to="360 400 300" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="300" r="60" fill="#0e7490" fill-opacity="0.2" stroke="#22d3ee" stroke-width="3" />
    <text x="400" y="295" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold" font-size="14">ARCHITECT</text>
    <text x="400" y="315" text-anchor="middle" fill="#22d3ee" font-family="Arial" font-weight="bold" font-size="18">P'JOE</text>

    <!-- UEI Outer Shell -->
    <circle cx="400" cy="300" r="150" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.3" />
    
    <!-- Orbiting Modules -->
    <!-- Module 1: LawyerPros -->
    <g>
        <rect x="150" y="100" width="140" height="60" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
        <text x="220" y="130" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">LawyerPros</text>
        <text x="220" y="145" text-anchor="middle" fill="#22d3ee" font-family="Arial" font-size="10">Legal Defense</text>
        <path d="M 290 130 L 340 250" stroke="#22d3ee" stroke-width="1" stroke-dasharray="5,5" />
    </g>

    <!-- Module 2: Energy -->
    <g>
        <rect x="510" y="100" width="140" height="60" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
        <text x="580" y="130" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">sCO2 Turbine</text>
        <text x="580" y="145" text-anchor="middle" fill="#22d3ee" font-family="Arial" font-size="10">NV1 / NV2 Alpha</text>
        <path d="M 510 130 L 460 250" stroke="#22d3ee" stroke-width="1" stroke-dasharray="5,5" />
    </g>

    <!-- Module 3: Chronos -->
    <g>
        <rect x="330" y="450" width="140" height="60" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
        <text x="400" y="480" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">CHRONOS-V4</text>
        <text x="400" y="495" text-anchor="middle" fill="#22d3ee" font-family="Arial" font-size="10">Temporal Sync</text>
        <path d="M 400 450 L 400 380" stroke="#22d3ee" stroke-width="1" stroke-dasharray="5,5" />
    </g>

    <!-- Hyper-Scrum Data Streams -->
    <path d="M 100 300 Q 250 250 400 300 T 700 300" stroke="url(#cyanGrad)" stroke-width="2" fill="none" opacity="0.6">
        <animate attributeName="stroke-dasharray" from="0,1000" to="1000,0" dur="2s" repeatCount="indefinite" />
    </path>
    
    <text x="400" y="50" text-anchor="middle" fill="white" font-family="Arial" font-weight="black" font-size="28" letter-spacing="4">HYPER-SCRUM ENGINE</text>
    <text x="400" y="550" text-anchor="middle" fill="#22d3ee" font-family="Arial" font-weight="bold" font-size="14" letter-spacing="2">SUB-SECOND EXECUTION PROTOCOL ACTIVE</text>

    <!-- UEI Presence -->
    <text x="700" y="580" text-anchor="end" fill="#22d3ee" font-family="Arial" font-style="italic" font-size="12">Powered by UEI AIOS</text>
</svg>