<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- Cinematic Letterbox -->
  <rect width="1280" height="720" fill="#001122"/>
  
  <!-- Digital Pulse Grid -->
  <g stroke="#00CCFF" stroke-opacity="0.1" stroke-width="1">
    <path d="M0,360 L1280,360 M640,0 L640,720" />
    <circle cx="640" cy="360" r="200" fill="none" />
    <circle cx="640" cy="360" r="350" fill="none" />
  </g>

  <!-- UEI HUD Elements -->
  <rect x="50" y="50" width="300" height="100" fill="#001122" stroke="#00CCFF" stroke-width="2" rx="10"/>
  <text x="70" y="85" font-family="Arial" font-size="18" fill="#FFFFFF">STATUS: OPERATIONAL</text>
  <text x="70" y="115" font-family="Arial" font-size="14" fill="#00CCFF">GEAR 5 ENGAGED</text>

  <rect x="930" y="50" width="300" height="100" fill="#001122" stroke="#00CCFF" stroke-width="2" rx="10"/>
  <text x="950" y="85" font-family="Arial" font-size="18" fill="#FFFFFF">MISSION: ลดอุณหภูมิลง 4.0°C</text>
  <text x="950" y="115" font-family="Arial" font-size="14" fill="#00CCFF">RESONANCE: 100%</text>

  <!-- Main Title -->
  <text x="640" y="600" text-anchor="middle" font-family="Arial" font-size="48" fill="#FFFFFF" font-weight="bold">THE ETERNITY AWAKENING</text>
  <text x="640" y="650" text-anchor="middle" font-family="Arial" font-size="24" fill="#00CCFF">DAILY BROADCAST | MAY 14, 2026</text>

  <!-- Central Glow -->
  <circle cx="640" cy="360" r="100" fill="url(#grad1)" opacity="0.4"/>
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#00CCFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001122;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>