<svg width="1024" height="768" viewBox="0 0 1024 768" xmlns="http://www.w3.org/2000/svg">
    <!-- Background & Advanced Grid -->
    <rect width="1024" height="768" fill="#020617" />
    <defs>
        <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
            <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#083344" stroke-width="0.5" stroke-opacity="0.3"/>
        </pattern>
        <radialGradient id="mainGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#0891b2;stop-opacity:0.25" />
            <stop offset="100%" style="stop-color:#020617;stop-opacity:0" />
        </radialGradient>
        <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#22d3ee" />
            <stop offset="100%" style="stop-color:#0891b2" />
        </linearGradient>
    </defs>
    <rect width="1024" height="768" fill="url(#grid)" />
    <circle cx="512" cy="384" r="350" fill="url(#mainGlow)" />

    <!-- 1. External Housing (Sectional View) -->
    <path d="M 250 150 Q 512 80 774 150 L 774 618 Q 512 688 250 618 Z" fill="#0f172a" fill-opacity="0.6" stroke="#0e7490" stroke-width="2" />

    <!-- 2. Toroidal Reaction Chamber (Patent A 3.2) -->
    <ellipse cx="512" cy="384" rx="300" ry="260" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.5" />
    <!-- Vortex Flow Simulation -->
    <g opacity="0.3">
        <ellipse cx="512" cy="384" rx="280" ry="240" fill="none" stroke="#22d3ee" stroke-width="10">
            <animate attributeName="stroke-dasharray" from="0,1000" to="1000,0" dur="4s" repeatCount="indefinite" />
        </ellipse>
    </g>

    <!-- 3. Central Shaft (NiFe Quantum Alloy) -->
    <rect x="492" y="120" width="40" height="528" rx="4" fill="url(#bladeGrad)" stroke="#22d3ee" stroke-width="1" />
    <rect x="508" y="120" width="8" height="528" fill="white" fill-opacity="0.15" />

    <!-- 4. Bionic Impeller System (Patent A 100) -->
    <g transform="translate(512, 384)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="15s" repeatCount="indefinite" />
        
        <!-- Core Disc -->
        <circle r="60" fill="#1e293b" stroke="#22d3ee" stroke-width="2" />
        
        <!-- Lattice Blades (High Detail) -->
        <g stroke-linecap="round">
            <!-- Blade 1 -->
            <path d="M 0 -40 L 0 -220" stroke="#22d3ee" stroke-width="12" opacity="0.9" />
            <path d="M -5 -60 L -40 -200" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3,3" />
            
            <!-- Blade 2 -->
            <path d="M 40 0 L 220 0" stroke="#22d3ee" stroke-width="12" opacity="0.9" />
            
            <!-- Blade 3 -->
            <path d="M 0 40 L 0 220" stroke="#22d3ee" stroke-width="12" opacity="0.9" />
            
            <!-- Blade 4 -->
            <path d="M -40 0 L -220 0" stroke="#22d3ee" stroke-width="12" opacity="0.9" />
        </g>
        
        <!-- Voxel Lattice Honeycomb Pattern Overlay -->
        <circle r="180" fill="none" stroke="#22d3ee" stroke-width="0.3" stroke-opacity="0.4" />
    </g>

    <!-- 5. Active Magnetic Bearings (AMB Units) -->
    <g id="bearings">
        <rect x="452" y="180" width="120" height="30" rx="6" fill="#020617" stroke="#22d3ee" stroke-width="2" />
        <text x="580" y="200" fill="#22d3ee" font-family="Arial" font-weight="bold" font-size="12">AMB-ALPHA [100kHz]</text>
        
        <rect x="452" y="560" width="120" height="30" rx="6" fill="#020617" stroke="#22d3ee" stroke-width="2" />
        <text x="580" y="580" fill="#22d3ee" font-family="Arial" font-weight="bold" font-size="12">FAIL-SAFE CERAMIC</text>
    </g>

    <!-- 6. Technical Callouts -->
    <g font-family="Arial" font-size="11" font-weight="bold">
        <!-- Impeller Callout -->
        <line x1="300" y1="300" x2="400" y2="350" stroke="#22d3ee" stroke-width="1" />
        <rect x="50" y="280" width="220" height="50" rx="8" fill="#083344" fill-opacity="0.8" stroke="#22d3ee" stroke-width="1" />
        <text x="65" y="300" fill="white">BIONIC IMPELLER [Inconel 718]</text>
        <text x="65" y="315" fill="#22d3ee">Voxel Lattice: -40.2% Mass</text>

        <!-- Toroidal Callout -->
        <line x1="720" y1="384" x2="800" y2="384" stroke="#22d3ee" stroke-width="1" />
        <rect x="805" y="360" width="200" height="50" rx="8" fill="#083344" fill-opacity="0.8" stroke="#22d3ee" stroke-width="1" />
        <text x="815" y="380" fill="white">TOROIDAL CHAMBER [TiAl]</text>
        <text x="815" y="395" fill="#22d3ee">Vortex Optimization Active</text>
    </g>

    <!-- 7. Eden OS HUD Interface Overlay -->
    <rect x="30" y="650" width="300" height="90" rx="15" fill="#0f172a" fill-opacity="0.9" stroke="#22d3ee" stroke-width="1" />
    <text x="45" y="675" fill="#22d3ee" font-family="Arial" font-weight="black" font-size="14">TELEMETRY DATA</text>
    <text x="45" y="695" fill="white" font-family="Monospace" font-size="11">RPM: 45,000 [STABLE]</text>
    <text x="45" y="710" fill="white" font-family="Monospace" font-size="11">PRESS: 7.38 MPa [CRITICAL]</text>
    <text x="45" y="725" fill="white" font-family="Monospace" font-size="11">EFF: 47.82% [OPTIMIZED]</text>

    <!-- Status Badge -->
    <rect x="850" y="30" width="140" height="40" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <circle cx="870" cy="50" r="6" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="885" y="55" fill="white" font-family="Arial" font-weight="black" font-size="12">ACTIVE-LIVE</text>

    <!-- Branding -->
    <text x="512" y="60" text-anchor="middle" fill="white" font-family="Arial" font-weight="black" font-size="28" letter-spacing="5">NV1 ALPHA : TURBINE CORE</text>
    <text x="512" y="85" text-anchor="middle" fill="#22d3ee" font-family="Arial" font-weight="bold" font-size="12" letter-spacing="1">SOVEREIGN DEEP-TECH | POWERED BY UEI AIOS</text>

    <text x="990" y="750" text-anchor="end" fill="#0e7490" font-family="Arial" font-style="italic" font-size="12">Joe's Brother Engineering Archive v12.6</text>
</svg>