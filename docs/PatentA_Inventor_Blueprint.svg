<svg width="1400" height="1000" viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Technical Background -->
    <rect width="1400" height="1000" fill="#ffffff" />
    <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
        </pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
        </marker>
        <marker id="blueArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9" />
        </marker>
    </defs>
    <rect width="1400" height="1000" fill="url(#grid)" />

    <!-- TITLE & STATUS -->
    <text x="700" y="50" text-anchor="middle" font-family="Arial" font-weight="black" font-size="32" letter-spacing="2">sCO2 BIONIC TURBINE : ARCHITECTURAL SCHEMATIC (NV1)</text>
    <text x="700" y="80" text-anchor="middle" font-family="Arial" font-size="14" fill="#64748b">REVERSE-ENGINEERED FOR PHYSICAL ASSEMBLY | MASTER PROTOCOL V12.6</text>

    <!-- 1. MAIN CASING ASSEMBLY (50) - Translucent Cutaway -->
    <path d="M 300 150 L 1100 150 Q 1150 150 1150 200 L 1150 700 Q 1150 750 1100 750 L 300 750 Q 250 750 250 700 L 250 200 Q 250 150 300 150" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    
    <!-- 2. INTERNAL CORE SYSTEM -->
    <!-- Rotor Shaft (110) -->
    <rect x="150" y="440" width="1100" height="20" rx="2" fill="#cbd5e1" stroke="#000000" />
    <text x="1120" y="430" font-family="Arial" font-weight="bold" font-size="14">110</text>

    <!-- Bionic Impeller (100) - Detailed Cross-Section -->
    <g id="impeller_core" transform="translate(650, 450)">
        <!-- Backplate -->
        <path d="M -10 -180 L 10 -180 L 20 180 L -20 180 Z" fill="#94a3b8" />
        <!-- Voxel Lattice Visual Logic -->
        <g stroke="#0ea5e9" stroke-width="0.5" opacity="0.6">
            <rect x="-10" y="-170" width="20" height="340" fill="none" />
            <path d="M -10 -150 L 10 -130 M -10 -110 L 10 -90 M -10 -70 L 10 -50" />
            <path d="M -10 50 L 10 70 M -10 90 L 10 110 M -10 130 L 10 150" />
        </g>
        <!-- Fluid Vortex Arrows (Input/Output) -->
        <path d="M -80 -100 Q -40 -120 0 -100" stroke="#0ea5e9" stroke-width="2" marker-end="url(#blueArrow)" fill="none" />
        <path d="M -80 100 Q -40 120 0 100" stroke="#0ea5e9" stroke-width="2" marker-end="url(#blueArrow)" fill="none" />
        <text x="-50" y="-190" font-family="Arial" font-weight="bold" font-size="16">100</text>
    </g>

    <!-- 3. HYBRID LEVITATION SYSTEM (Patent Detail 200/300) -->
    <!-- Front Set -->
    <g transform="translate(400, 450)">
        <!-- Active Magnetic Bearing (200A) -->
        <rect x="-40" y="-120" width="80" height="40" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <rect x="-40" y="80" width="80" height="40" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <!-- Coil Detail (210) -->
        <path d="M -30 -110 L 30 -110 M -30 -100 L 30 -100" stroke="#ef4444" stroke-width="1" />
        <text x="-35" y="-130" font-family="Arial" font-weight="bold" font-size="12">200A [AMB]</text>
        
        <!-- Touchdown Bearing (300) -->
        <circle cx="80" cy="0" r="35" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
        <circle cx="80" cy="0" r="28" fill="none" stroke="#64748b" stroke-width="0.5" stroke-dasharray="2,2" />
        <text x="65" y="55" font-family="Arial" font-weight="bold" font-size="12">300 [TD]</text>
    </g>

    <!-- Rear Set -->
    <g transform="translate(950, 450)">
        <rect x="-40" y="-120" width="80" height="40" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <rect x="-40" y="80" width="80" height="40" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="-35" y="-130" font-family="Arial" font-weight="bold" font-size="12">200B [AMB]</text>
        
        <!-- Touchdown Bearing (400) -->
        <circle cx="-80" cy="0" r="35" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
        <text x="-95" y="55" font-family="Arial" font-weight="bold" font-size="12">400 [TD]</text>
    </g>

    <!-- 4. CONTROL & SENSING LOGIC (The Brain) -->
    <!-- Position Sensors (220) -->
    <rect x="250" y="430" width="10" height="40" fill="#0ea5e9" />
    <path d="M 255 430 Q 255 350 350 350" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="5,2" />
    
    <!-- Control Unit (230) -->
    <rect x="350" y="300" width="100" height="70" rx="5" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" />
    <text x="365" y="340" fill="#0ea5e9" font-family="Arial" font-weight="black" font-size="18">AI</text>
    <text x="460" y="335" font-family="Arial" font-size="11" font-weight="bold">230 : 100 kHz PREDICTIVE LOOP</text>
    <text x="460" y="350" font-family="Arial" font-size="10" fill="#64748b">Real-time Gap Compensation (100 µm)</text>

    <!-- 5. FLOW & THERMAL PATHS -->
    <!-- Inlet sCO2 -->
    <path d="M 50 350 Q 200 350 250 250" stroke="#10b981" stroke-width="4" marker-end="url(#arrow)" fill="none" />
    <text x="50" y="335" fill="#10b981" font-family="Arial" font-weight="black" font-size="16">sCO2 INLET [7.38 MPa @ 31.1°C]</text>
    
    <!-- Integrated Cooling Network -->
    <path d="M 250 700 L 1150 700" stroke="#0ea5e9" stroke-width="2" opacity="0.3" />
    <text x="300" y="725" fill="#0ea5e9" font-family="Arial" font-size="11" font-weight="bold">CLOSED-LOOP COOLING NETWORK</text>

    <!-- TECHNICAL LEGEND (Right Sidebar) -->
    <rect x="1170" y="150" width="210" height="600" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="1185" y="185" font-family="Arial" font-weight="black" font-size="18" fill="#1e293b">LEGEND</text>
    <g font-family="Arial" font-size="12" fill="#334155">
        <text x="1185" y="220">50 : External Casing</text>
        <text x="1185" y="245">100 : Bionic Impeller</text>
        <text x="1185" y="270">110 : Rotor Shaft</text>
        <text x="1185" y="295">200 : AMB Assembly</text>
        <text x="1185" y="320">210 : Electromagnetic Coils</text>
        <text x="1185" y="345">220 : Position Sensors</text>
        <text x="1185" y="370">230 : AI Control Loop</text>
        <text x="1185" y="395">300/400 : TD Bearings</text>
    </g>

    <!-- FOOTER SIGNATURE -->
    <text x="700" y="950" text-anchor="middle" font-family="Arial" font-style="italic" font-size="14" fill="#94a3b8">Joe's Brother Engineering Archive | UEI Visual Lobe V12.6</text>
</svg>