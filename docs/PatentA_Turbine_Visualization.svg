<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="600" fill="#050b15" />
    
    <!-- Technical Grid -->
    <defs>
        <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0e7490" stroke-width="0.3" stroke-opacity="0.15"/>
        </pattern>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#050b15;stop-opacity:0" />
        </radialGradient>
        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#0e7490;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#164e63;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect width="800" height="600" fill="url(#smallGrid)" />
    <circle cx="400" cy="300" r="250" fill="url(#glow)" />

    <!-- Toroidal Chamber Outline (Patent A Section 3.2) -->
    <ellipse cx="400" cy="300" rx="200" ry="180" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="5,5" opacity="0.4" />
    <ellipse cx="400" cy="300" rx="240" ry="210" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.2" />

    <!-- Central Shaft (NiFe Quantum Alloy - Section 3.1/3.2) -->
    <rect x="385" y="100" width="30" height="400" rx="5" fill="url(#metalGrad)" stroke="#22d3ee" stroke-width="1" />
    <rect x="397" y="100" width="6" height="400" fill="white" fill-opacity="0.2" />

    <!-- Bionic Impeller (Lattice Structure - Patent A 100) -->
    <g transform="translate(400, 300)">
        <!-- Rotating animation for effect -->
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite" />
        
        <!-- Bionic Blades (Lattice Simulation) -->
        <path d="M -150 0 L 150 0 M 0 -150 L 0 150" stroke="#22d3ee" stroke-width="2" opacity="0.3" />
        
        <circle r="120" fill="none" stroke="#22d3ee" stroke-width="0.5" stroke-dasharray="2,2" />
        
        <!-- Curved Bionic Blades -->
        <path d="M 0 0 Q 80 -40 140 -20" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />
        <path d="M 0 0 Q -80 40 -140 20" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />
        <path d="M 0 0 Q 40 80 20 140" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />
        <path d="M 0 0 Q -40 -80 -20 -140" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />
        
        <!-- Lattice Honeycomb Simulation (Voxel) -->
        <circle r="40" fill="#050b15" stroke="#22d3ee" stroke-width="1" />
        <path d="M -20 -10 L 0 -20 L 20 -10 L 20 10 L 0 20 L -20 10 Z" fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.8" />
    </g>

    <!-- Active Magnetic Bearings (AMB - Patent A 200) -->
    <!-- Top Bearing -->
    <rect x="360" y="150" width="80" height="20" rx="5" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
    <text x="450" y="165" fill="#22d3ee" font-family="Arial" font-weight="bold" font-size="10">ACTIVE MAGNETIC BEARING (200)</text>
    
    <!-- Bottom Bearing -->
    <rect x="360" y="430" width="80" height="20" rx="5" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
    
    <!-- Labels & Callouts -->
    <line x1="260" y1="280" x2="330" y2="300" stroke="#22d3ee" stroke-width="1" />
    <text x="100" y="270" fill="white" font-family="Arial" font-weight="bold" font-size="12">BIONIC LATTICE IMPELLER (100)</text>
    <text x="100" y="285" fill="#22d3ee" font-family="Arial" font-size="10">45,000 RPM | 40% Weight Reduction</text>

    <line x1="550" y1="350" x2="480" y2="380" stroke="#22d3ee" stroke-width="1" />
    <text x="560" y="355" fill="white" font-family="Arial" font-weight="bold" font-size="12">TOROIDAL REACTION CHAMBER</text>
    <text x="560" y="370" fill="#22d3ee" font-family="Arial" font-size="10">sCO2 Vortex Flow Optimization</text>

    <!-- Header & Info -->
    <text x="400" y="50" text-anchor="middle" fill="white" font-family="Arial" font-weight="black" font-size="24" letter-spacing="2">sCO2 BIONIC TURBINE : PATENT A</text>
    <text x="400" y="75" text-anchor="middle" fill="#22d3ee" font-family="Arial" font-weight="bold" font-size="12">DEEP-TECH ENGINEERING DISCLOSURE | JB-PAT-A-2026</text>

    <!-- Tech Status -->
    <rect x="630" y="520" width="150" height="60" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#22d3ee" stroke-width="1" />
    <text x="645" y="540" fill="white" font-family="Arial" font-weight="bold" font-size="10">SYSTEM STATUS</text>
    <circle cx="760" cy="537" r="4" fill="#22d3ee" />
    <text x="645" y="565" fill="#22d3ee" font-family="Arial" font-weight="black" font-size="14">OPTIMIZED</text>

    <!-- Footer -->
    <text x="25" y="580" fill="#0e7490" font-family="Arial" font-size="10">© 2026 Joe's Brother Engineering | Powered by UEI AIOS</text>
</svg>