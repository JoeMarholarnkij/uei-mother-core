<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Layout Background -->
  <rect width="800" height="600" fill="#0a0f1d" />
  <defs>
    <pattern id="blueprintGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2533" stroke-width="1"/>
    </pattern>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#445566;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#223344;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#blueprintGrid)" />

  <!-- Main Title -->
  <text x="40" y="50" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#00ffff" letter-spacing="1">SPF-V1 "SOVEREIGN" ASSEMBLY WORKBENCH</text>
  <text x="40" y="75" font-family="Arial, sans-serif" font-size="12" fill="#667788" letter-spacing="1">PROJECT: MICRO-FACTORY | TOLERANCE: ±0.01mm | LOAD: 500KG</text>

  <!-- ISO-7 Positive Pressure Zone Indicator -->
  <path d="M150 150 L650 150 L650 500 L150 500 Z" fill="none" stroke="#00ffff" stroke-width="0.5" stroke-dasharray="10,5" stroke-opacity="0.3" />
  <text x="160" y="170" font-family="Arial" font-size="10" fill="#00ffff" fill-opacity="0.5">ISO-7 LAMINAR FLOW BOUNDARY</text>

  <!-- Table Surface (316L Stainless + ESD Mat) -->
  <rect x="200" y="250" width="400" height="40" fill="url(#metalGrad)" rx="5" stroke="#00ffff" stroke-width="2" />
  <rect x="210" y="255" width="380" height="10" fill="#112233" rx="2" /> <!-- ESD Mat Layer -->
  <text x="320" y="275" font-family="Arial" font-size="10" font-weight="bold" fill="#00ffff">ESD-SAFE SOVEREIGN SURFACE</text>

  <!-- Anti-Vibration Granite Core (Internal) -->
  <rect x="220" y="290" width="360" height="20" fill="#333333" stroke="#666666" stroke-width="1" stroke-dasharray="2,2" />
  <text x="330" y="305" font-family="Arial" font-size="8" fill="#8899aa">INTERNAL GRANITE DAMPING CORE</text>

  <!-- Legs with Motorized Actuators (Patent H) -->
  <rect x="210" y="290" width="30" height="180" fill="#223344" />
  <rect x="560" y="290" width="30" height="180" fill="#223344" />
  
  <!-- Linear Actuator Details -->
  <rect x="215" y="320" width="20" height="100" fill="#0088ff" fill-opacity="0.3" />
  <rect x="565" y="320" width="20" height="100" fill="#0088ff" fill-opacity="0.3" />
  <text x="100" y="380" font-family="Arial" font-size="10" fill="#0088ff" text-anchor="end">BIONIC HEIGHT ADJUST (SMC)</text>
  <path d="M110 375 L210 350" stroke="#0088ff" stroke-width="1" fill="none" marker-end="url(#arrow)" />

  <!-- Active Pneumatic Isolators (Feet) -->
  <circle cx="225" cy="480" r="15" fill="#ff00ff" fill-opacity="0.4" />
  <circle cx="575" cy="480" r="15" fill="#ff00ff" fill-opacity="0.4" />
  <text x="300" y="520" font-family="Arial" font-size="10" fill="#ff00ff">ACTIVE PNEUMATIC ISOLATORS (Damping &lt; 0.1)</text>

  <!-- UWB Spatial Anchors -->
  <circle cx="210" cy="260" r="5" fill="#ffff00" />
  <circle cx="590" cy="260" r="5" fill="#ffff00" />
  <circle cx="210" cy="490" r="5" fill="#ffff00" />
  <circle cx="590" cy="490" r="5" fill="#ffff00" />
  <text x="605" y="265" font-family="Arial" font-size="10" fill="#ffff00">UWB SPATIAL ANCHORS (&lt; 2cm)</text>

  <!-- EDEN-BUS Connectivity Point -->
  <rect x="550" y="420" width="15" height="15" fill="#00ff88" />
  <text x="575" y="432" font-family="Arial" font-size="10" fill="#00ff88">EDEN-BUS PORT</text>

  <!-- Grounding Post -->
  <circle cx="230" cy="270" r="4" fill="#00ff00" />
  <path d="M230 274 L230 285 L220 285" fill="none" stroke="#00ff00" stroke-width="1" />
  <text x="238" y="275" font-family="Arial" font-size="8" fill="#00ff00">1MΩ GROUNDING POST</text>

  <!-- Holographic Mount -->
  <path d="M500 250 L520 200 L550 200" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" />
  <rect x="545" y="195" width="20" height="10" fill="#ffffff" fill-opacity="0.2" />
  <text x="525" y="190" font-family="Arial" font-size="10" fill="#ffffff" fill-opacity="0.8">AR PROJECTION MOUNT</text>

  <!-- Status Marker -->
  <circle cx="50" cy="560" r="8" fill="#00ff88" />
  <text x="70" y="565" font-family="Arial" font-weight="bold" font-size="14" fill="#00ff88">STATUS: BLUEPRINT LOCKED</text>

  <!-- Markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0088ff" />
    </marker>
  </defs>
</svg>