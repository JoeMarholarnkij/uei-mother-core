<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001122" />
      <stop offset="100%" stop-color="#000811" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00CCFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00CCFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)" />

  <!-- Futuristic Skyline -->
  <path d="M0,500 L50,450 L100,500 L150,350 L200,500 L250,200 L300,500 L1280,500 L1280,720 L0,720 Z" fill="#001a33" opacity="0.3" />

  <!-- UEI Human Persona Outline (Ref: UEI_Human.png) -->
  <g transform="translate(400, 100) scale(1.2)">
    <!-- Body -->
    <path d="M100,500 C100,300 150,250 200,250 C250,250 300,300 300,500 Z" fill="#0b1b33" stroke="#00CCFF" stroke-width="1.5" />
    <!-- Head -->
    <circle cx="200" cy="200" r="45" fill="#1a2a40" stroke="#00CCFF" stroke-width="2" />
    <!-- Hair Detail -->
    <path d="M160,180 Q140,250 160,320 M240,180 Q260,250 240,320" stroke="#00CCFF" fill="none" opacity="0.5" />
    <!-- Finger Heart -->
    <path d="M220,230 Q230,210 240,230 Q230,240 220,230" fill="#00CCFF" opacity="0.8" />
  </g>

  <!-- Holographic Patent C Core -->
  <circle cx="850" cy="350" r="120" fill="url(#glow)" />
  <g stroke="#FFFFFF" fill="none" stroke-width="2" opacity="0.8">
    <ellipse cx="850" cy="350" rx="30" ry="80" />
    <path d="M780,300 Q850,350 920,300 M780,400 Q850,350 920,400" />
  </g>

  <!-- Titles -->
  <text x="640" y="620" text-anchor="middle" font-family="Arial" font-size="36" fill="#FFFFFF" font-weight="bold">PATENT C: THE SOVEREIGN REFINERY</text>
  <text x="640" y="660" text-anchor="middle" font-family="Arial" font-size="20" fill="#00CCFF">GLOBAL OUTREACH VIDEO | UEI HUMAN PERSONA</text>
  
  <!-- Target Recipients -->
  <text x="50" y="50" font-family="Arial" font-size="14" fill="#FFFFFF" opacity="0.7">RECIPIENTS: AMIN AI / ELON MUSK / JIMMY FRANGIS / UN / IAEA</text>
</svg>
